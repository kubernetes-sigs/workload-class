apiVersion: workloads.x-k8s.io/v1alpha1
kind: WorkloadClassGuardrail
metadata:
  name: default
spec:
  constraints:
    disruption:
      daysOfWeek:
        - Saturday
        - Sunday
      maxAllowedWindows: 2
      maxNonDisruptionDurationDays: 30
  disruptionCauses:
    - name: VerticalPodAutoscaler
      subjects:
        - kind: ServiceAccount
          name: vpa-updater
          namespace: kube-system
    - name: ClusterAutoscaler
      subjects:
        - kind: ServiceAccount
          name: cluster-autoscaler
          namespace: kube-system
