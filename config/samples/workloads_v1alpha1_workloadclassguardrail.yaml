apiVersion: workloads.x-k8s.io/v1alpha1
kind: WorkloadClassGuardrail
metadata:
  name: default
spec:
  constraints:
    disruption:
      daysOfWeek:
        - Saturday
        - Sunday
      maxAllowedWindows: 2
      maxNonDisruptionDurationDays: 30
      causeIdentities:
        - cause: VPA
          subjects:
            - kind: ServiceAccount
              name: vpa-updater
              namespace: kube-system
        - cause: ClusterAutoscaler
          subjects:
            - kind: ServiceAccount
              name: cluster-autoscaler
              namespace: kube-system
